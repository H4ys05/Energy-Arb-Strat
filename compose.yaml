services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: energy_arb
      POSTGRES_USER: energy_arb
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_arb -d energy_arb"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
